services:
  - type: web
    name: formbot-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: REDIS_URL
        sync: false
